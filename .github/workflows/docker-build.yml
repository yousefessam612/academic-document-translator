name: Build and push Docker image

# Builds the app image and publishes it to GitHub Container Registry (GHCR)
# so it can be deployed on any Docker host (ClawCloud Run, Back4App, etc.).
on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image is available
        run: |
          echo "Image published: ${REGISTRY}/${IMAGE_NAME}:latest"
          docker manifest inspect ${REGISTRY}/${IMAGE_NAME}:latest > /dev/null && echo "manifest OK" || echo "manifest not public yet (visibility must be set)"
